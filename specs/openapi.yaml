          additionalProperties: true
      required:
        - code
        - message
        - request_id
        - retryable
    User:
      type: object
      properties:
        id: *a1
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          type: string
          enum:
            - MANAGER
            - CASHIER
        active:
          type: boolean
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - display_name
        - role
        - active
        - version
        - created_at
      additionalProperties: false
    Login:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 200
          writeOnly: true
      required:
        - email
        - password
    LoginResult:
      type: object
      properties:
        user:
          type: object
        csrf_token:
          type: string
      required:
