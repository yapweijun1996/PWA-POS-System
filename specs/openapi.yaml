openapi: 3.1.0
info:
  title: Counter POS V1 API
  version: 1.0.0
  description: Implemented local single-store API. Same-origin cookie and CSRF
    authentication. Cash-only offline; external methods are manual records.
    Runtime validation and financial invariants also require the shared domain
    rules. See docs/adr/001-v1-implementation.md.
servers:
  - url: /api/v1
    description: Same-origin application API
security:
  - cookieAuth: []
paths:
  /auth/login:
    post:
      summary: Sign in online
      operationId: post__auth_login
      description: Validate Origin and login rate limits. Set secure HttpOnly cookie;
        rotate session. Never return the cookie as JSON.
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      security: []
  /auth/logout:
    post:
      summary: Revoke server session
      operationId: post__auth_logout
      description: Revoke server session
      responses:
        "204":
          description: Successful operation
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
      security:
        - cookieAuth: []
          csrfToken: []
  /bootstrap:
    get:
      summary: Load authorized store/user/device bootstrap
      operationId: get__bootstrap
      description: Load authorized store/user/device bootstrap
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /devices:
    post:
      summary: Enroll a named terminal; manager only
      operationId: post__devices
      description: Enroll a named terminal; manager only
      responses:
        "201":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceEnroll"
      security:
        - cookieAuth: []
          csrfToken: []
  /categories:
    get:
      summary: List categories
      operationId: get__categories
      description: List categories
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
                minItems: 0
                maxItems: 100
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      summary: Create a category
      description: Manager only; normal cookie/CSRF authorization.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
              required:
                - name
              additionalProperties: false
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /products:
    get:
      summary: List cashier-safe catalogue projection
      operationId: get__products
      description: List cashier-safe catalogue projection
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsPage"
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 100
    post:
      summary: Create product and initial price revision; manager only
      operationId: post__products
      description: Create product and initial price revision; manager only
      responses:
        "201":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductWrite"
      security:
        - cookieAuth: []
          csrfToken: []
  /products/{id}:
    patch:
      summary: Update or archive product with optimistic version; manager only
      operationId: patch__products__id_
      description: Update or archive product with optimistic version; manager only
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      parameters:
        - name: id
          in: path
          required: true
          schema: &a1
            type: string
            format: uuid
      security:
        - cookieAuth: []
          csrfToken: []
  /inventory/balances:
    get:
      summary: List stock balance projections; manager
      operationId: get__inventory_balances
      description: List stock balance projections; manager
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockBalance"
                minItems: 0
                maxItems: 100
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
  /inventory/ledger:
    get:
      summary: Read stock ledger; manager
      operationId: get__inventory_ledger
      description: Read stock ledger; manager
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockMovement"
                minItems: 0
                maxItems: 100
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 100
  /inventory/receipts:
    post:
      summary: Receive stock as a ledger movement; manager online
      operationId: post__inventory_receipts
      description: quantity_delta must be positive. client_event_id is durable dedup
        identity. No purchase invoice is created.
      responses:
        "201":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockBalance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockReceipt"
      security:
        - cookieAuth: []
          csrfToken: []
  /inventory/adjustments:
    post:
      summary: Post reasoned quantity adjustment; manager online
      operationId: post__inventory_adjustments
      description: Nonzero delta, expected balance version, actor and reason.
        Atomically write movement and projection; stale version yields 409.
      responses:
        "201":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockBalance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAdjustment"
      security:
        - cookieAuth: []
          csrfToken: []
  /shifts:
    post:
      summary: Open the single active shift online
      operationId: post__shifts
      description: Open the single active shift online
      responses:
        "201":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftOpen"
      security:
        - cookieAuth: []
          csrfToken: []
  /shifts/current:
    get:
      summary: Read current shift
      operationId: get__shifts_current
      description: Read current shift
      responses:
        "200":
          description: Current shift or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Shift"
                  - type: "null"
  /shifts/{id}/count:
    post:
      summary: Save a cash-count draft without closing
      operationId: post__shifts__id__count
      description: Save a cash-count draft without closing
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftCount"
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
      security:
        - cookieAuth: []
          csrfToken: []
  /shifts/{id}/close:
    post:
      summary: Close a fully reconciled shift online
      operationId: post__shifts__id__close
      description: Close a fully reconciled shift online
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftClose"
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
      security:
        - cookieAuth: []
          csrfToken: []
  /shifts/{id}/cash-movements:
    post:
      summary: Record reasoned non-sale cash in or out
      operationId: post__shifts__id__cash_movements
      description: Record reasoned non-sale cash in or out
      responses:
        "201":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  id: &a3
                    type: string
                    format: uuid
                required:
                  - id
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashMovement"
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
      security:
        - cookieAuth: []
          csrfToken: []
  /shifts/{id}/offline-permit:
    post:
      summary: Issue bounded offline authorization after readiness
      operationId: post__shifts__id__offline_permit
      description: Issue bounded offline authorization after readiness
      responses:
        "201":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflinePermit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
              required: []
              additionalProperties: false
        required: true
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
      security:
        - cookieAuth: []
          csrfToken: []
  /sales:
    post:
      summary: Atomically post one frozen sale
      operationId: post__sales
      description: Derive store and cashier from auth. Recompute money; verify price
        revisions and offline permit; lock shift/balances; write sale, lines,
        payment, stock, audit and event in one transaction. Return 201 only
        after commit; 200 on identical replay. 409 on same ID with different
        content; never auto-reprice a completed permitted offline sale.
      responses:
        "200":
          description: Identical replay; returns the original committed result
          content:
            application/json:
              schema: &a2
                $ref: "#/components/schemas/SaleResult"
        "201":
          description: Successful operation
          content:
            application/json:
              schema: *a2
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleCommand"
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: *a3
          description: Same client_sale_id/client_refund_id on every exact retry. Changed
            payload gives 409.
      security:
        - cookieAuth: []
          csrfToken: []
    get:
      summary: List posted sale summaries
      operationId: get__sales
      description: List posted sale summaries
      responses:
        "200":
          description: Bounded posted sales
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  type: object
                  additionalProperties: true
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 100
  /sales/{id}:
    get:
      summary: Read immutable sale and receipt snapshots
      operationId: get__sales__id_
      description: Read immutable sale and receipt snapshots
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleDetail"
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
  /refunds:
    post:
      summary: Post linked manager-approved refund online
      operationId: post__refunds
      description: Lock original lines. Calculate remaining refundable quantity and
        cumulative rounding allocation. Commit refund, refund payment, restock
        movements and audit together. Exactly-once business effect depends on
        tested durable deduplication, not the header alone.
      responses:
        "200":
          description: Identical replay; returns the original committed result
          content:
            application/json:
              schema: &a4
                $ref: "#/components/schemas/RefundResult"
        "201":
          description: Successful operation
          content:
            application/json:
              schema: *a4
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundCommand"
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: *a3
          description: Same client_sale_id/client_refund_id on every exact retry. Changed
            payload gives 409.
      security:
        - cookieAuth: []
          csrfToken: []
  /refunds/{id}:
    get:
      summary: Read refund result; manager only
      operationId: get__refunds__id_
      description: Read refund result; manager only
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
  /reports/daily:
    get:
      summary: Read server-posted daily sales; manager only
      operationId: get__reports_daily
      description: Read server-posted daily sales; manager only
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
      parameters:
        - name: business_date
          in: query
          required: true
          schema:
            type: string
            format: date
  /sync/status:
    get:
      summary: Probe authenticated server reachability
      operationId: get__sync_status
      description: Probe authenticated server reachability
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /sync/catalogue:
    get:
      summary: Pull versioned products and tombstones
      operationId: get__sync_catalogue
      description: Pull versioned products and tombstones
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
