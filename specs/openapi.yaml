components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: counter_session
      description: Secure HttpOnly SameSite session cookie set by server.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Authenticated anti-CSRF token; validate Origin too.
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
        message:
          type: string
          minLength: 1
          maxLength: 500
        request_id:
          type: string
          minLength: 1
          maxLength: 100
        retryable:
          type: boolean
        details:
