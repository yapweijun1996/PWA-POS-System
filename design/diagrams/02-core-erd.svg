">same transaction</text><rect x="58" y="997" width="1484" height="96" rx="13" fill="#e4eeea" stroke="none"/><text x="82" y="1033" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#536a73" text-anchor="start">Ledger is authoritative; balance is a projection. All references remain store-scoped.</text><text x="82" y="1063" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#536a73" text-anchor="start">Refunds never delete sales. Exact compound keys, constraints and omitted support tables: specs/schema.sql.</text><line x1="58" y1="1133" x2="1542" y2="1133" stroke="#cdd8d5" stroke-width="2"/><text x="58" y="1163" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#647d80" text-anchor="start">Proposed V1 · Design contract, not a deployed application · 02 October 2026</text></svg>