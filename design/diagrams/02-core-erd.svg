<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1190" viewBox="0 0 1600 1190" role="img" aria-label=""><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#60787c"/></marker></defs><rect x="0" y="0" width="1600" height="1190" rx="0" fill="#f4f7f6" stroke="none"/><text x="58" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#0b6e61" text-anchor="start">COUNTER POS / DATA-01</text><text x="58" y="91" font-family="Inter, DejaVu Sans, sans-serif" font-size="34" font-weight="650" fill="#17333b" text-anchor="start">Core entity relationships</text><text x="58" y="124" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Conceptual reading view. The SQL contract contains all tables, keys and invariants.</text><rect x="58" y="185" width="415" height="179" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="80" y="220" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">Store / users / device</text><text x="80" y="253" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Store-scoped identity</text><text x="80" y="279" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Role + enrolled terminal</text><text x="80" y="305" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">One active selling device</text><rect x="586" y="185" width="415" height="179" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="608" y="220" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">Products / prices</text><text x="608" y="253" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Product ID + SKU + category</text><text x="608" y="279" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Immutable price revisions</text><text x="608" y="305" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">No editable stock field</text><rect x="1115" y="185" width="427" height="179" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="1137" y="220" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">Stock balance</text><text x="1137" y="253" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Store + product primary key</text><text x="1137" y="279" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Quantity + version</text><text x="1137" y="305" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Rebuildable projection</text><rect x="58" y="461" width="415" height="179" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="80" y="496" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">Shift / offline permit</text><text x="80" y="529" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Cash float + business date</text><text x="80" y="555" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">User + terminal authorization</text><text x="80" y="581" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Final close after reconciliation</text><rect x="586" y="461" width="415" height="179" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="608" y="496" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">Sale</text><text x="608" y="529" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Permanent client UUID</text><text x="608" y="555" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Canonical receipt + money</text><text x="608" y="581" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Immutable posted document</text><rect x="1115" y="461" width="427" height="179" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="1137" y="496" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">Sale line</text><text x="1137" y="529" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Product + price revision</text><text x="1137" y="555" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Name / SKU / price snapshots</text><text x="1137" y="581" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Quantity + tax + line total</text><rect x="58" y="767" width="415" height="189" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="80" y="802" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">Refund / refund line</text><text x="80" y="835" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Original sale + original line</text><text x="80" y="861" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Remaining entitlement lock</text><text x="80" y="887" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Restock decision + refund payment</text><rect x="586" y="767" width="415" height="189" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="608" y="802" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">Payment</text><text x="608" y="835" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">One applied tender per V1 sale</text><text x="608" y="861" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Cash tender less change</text><text x="608" y="887" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Manual external record boundary</text><rect x="1115" y="767" width="427" height="189" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="1137" y="802" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">Stock movement</text><text x="1137" y="835" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">SALE / RETURN / RECEIPT / ADJUST</text><text x="1137" y="861" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Concrete origin reference</text><text x="1137" y="887" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Immutable signed quantity</text><line x1="267" y1="364" x2="267" y2="461" stroke="#cdd8d5" stroke-width="2" marker-end="url(#arrow)"/><text x="282" y="413" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#17333b" text-anchor="start">1 → many shifts</text><line x1="473" y1="550" x2="586" y2="550" stroke="#cdd8d5" stroke-width="2" marker-end="url(#arrow)"/><text x="489" y="532" font-family=