 DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Do not clear local browser data</text><rect x="566" y="763" width="468" height="176" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="588" y="798" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">Refund is a separate document</text><text x="588" y="831" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Online, manager controlled</text><text x="588" y="857" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Original quantity / amount limits</text><text x="588" y="883" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Restock only when resalable</text><rect x="1089" y="763" width="453" height="176" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="1111" y="798" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">Final close is a server action</text><text x="1111" y="831" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Count draft may exist offline</text><text x="1111" y="857" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Drain and reconcile documents</text><text x="1111" y="883" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Record actual cash and variance</text><line x1="58" y1="1033" x2="1542" y2="1033" stroke="#cdd8d5" stroke-width="2"/><text x="58" y="1063" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#647d80" text-anchor="start">Proposed V1 · Design contract, not a deployed application · 02 October 2026</text></svg>