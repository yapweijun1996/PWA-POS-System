cts</text><text x="383" y="312" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Hold ≠ reserve</text><rect x="664" y="218" width="272" height="162" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="686" y="253" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">Review payment</text><text x="686" y="286" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Review due</text><text x="686" y="312" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Confirm cash</text><rect x="967" y="218" width="272" height="162" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="989" y="253" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">Local commit</text><text x="989" y="286" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Frozen document</text><text x="989" y="312" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Local receipt</text><rect x="1270" y="218" width="272" height="162" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="1292" y="253" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">Server posted</text><text x="1292" y="286" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Canonical receipt</text><text x="1292" y="312" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Ledger + payment</text><line x1="330" y1="298" x2="361" y2="298" stroke="#cdd8d5" stroke-width="2" marker-end="url(#arrow)"/><line x1="633" y1="298" x2="664" y2="298" stroke="#cdd8d5" stroke-width="