<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img" aria-label=""><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#60787c"/></marker></defs><rect x="0" y="0" width="1600" height="1110" rx="0" fill="#f4f7f6" stroke="none"/><text x="58" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#0b6e61" text-anchor="start">COUNTER POS / SYNC-01</text><text x="58" y="91" font-family="Inter, DejaVu Sans, sans-serif" font-size="34" font-weight="650" fill="#17333b" text-anchor="start">A sale survives a lost response</text><text x="58" y="124" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Durable local commit first; an identical replay returns the original server result.</text><rect x="45" y="174" width="270" height="70" rx="12" fill="#fff" stroke="#d2ded7"/><text x="180" y="217" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="650" fill="#17333b" text-anchor="middle">Cashier</text><line x1="180" y1="245" x2="180" y2="962" stroke="#cdd8d5" stroke-width="2" stroke-dasharray="6 5"/><rect x="450" y="174" width="270" height="70" rx="12" fill="#fff" stroke="#d2ded7"/><text x="585" y="217" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="650" fill="#17333b" text-anchor="middle">Device / IndexedDB</text><line x1="585" y1="245" x2="585" y2="962" stroke="#cdd8d5" stroke-width="2" stroke-dasharray="6 5"/><rect x="850" y="174" width="270" height="70" rx="12" fill="#fff" stroke="#d2ded7"/><text x="985" y="217" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="650" fill="#17333b" text-anchor="middle">API / idempotency</text><line x1="985" y1="245" x2="985" y2="962" stroke="#cdd8d5" stroke-width="2" stroke-dasharray="6 5"/><rect x="1280" y="174" width="270" height="70" rx="12" fill="#fff" stroke="#d2ded7"/><text x="1415" y="217" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="650" fill="#17333b" text-anchor="middle">PostgreSQL</text><line x1="1415" y1="245" x2="1415" y2="962" stroke="#cdd8d5" stroke-width="2" stroke-dasharray="6 5"/><line x1="180" y1="309" x2="585" y2="309" stroke="#cdd8d5" stroke-width="2" marker-end="url(#arrow)"/><text x="382.5" y="294" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#17333b" text-anchor="middle">1. Confirm cash received</text><rect x="426" y="341" width="318" height="80" rx="12" fill="#e1eee7" stroke="#c3d5c8"/><text x="443" y="373" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Atomic write: sale + tender</text><text x="443" y="398" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">stock delta + outbox</text><line x1="585" y1="461" x2="180" y2="461" stroke="#cdd8d5" stroke-width="2" marker-end="url(#arrow)"/><text x="382.5" y="446" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#17333b" text-anchor="middle">2. Show local receipt / pending</text><line x1="585" y1="527" x2="985" y2="527" stroke="#cdd8d5" stroke-width="2" marker-end="url(#arrow)"/><text x="785.0" y="512" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#17333b" text-anchor="middle">3. POST same frozen UUID</text><line x1="985" y1="594" x2="1415" y2="594" stroke="#cdd8d5" stroke-width="2" marker-end="url(#arrow)"/><text x="1200.0" y="579" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#17333b" text-anchor="middle">4. Validate + atomically post</text><rect x="1251" y="622" width="296" height="85" rx="12" fill="#e1eee7" stroke="#c3d5c8"/><text x="1271" y="655" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536a73" text-anchor="start">Sale + payment + movements</text><text x="1271" y="680" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#536a73" text-anchor="start">Unique key + payload hash</text><line x1="1415" y1="750" x2="985" y2="750" stroke="#cdd8d5" stroke-width="2" marker-end="url(#arrow)"/><text x="1200.0" y="735" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#17333b" text-anchor="middle">5. Commit acknowledged</text><line x1="985" y1="792" x2="680" y2="792" stroke="#a97143" stroke-width="2"/><text x="817" y="779" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="500" fill="#8a5700" text-anchor="middle">Response lost ×</text><line x1="585" y1="857" x2="985" y2="857" stroke="#cdd8d5" stroke-width="2" marker-end="url(#arrow)"/><text x="785.0" y="842" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#17333b" text-anchor="middle">6. Retry unchanged UUID</text><line x1="985" y1="923" x2="585" y2="923" stroke="#cdd8d5" stroke-width="2" marker-end="url(#arrow)"/><text x="785.0" y="908" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#17333b" text-anchor="middle">7. Return original receipt; ACK locally</text><text x="58" y="1009" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17333b" text-anchor="start">If content changes under the same UUID: 409 → NEEDS_REVIEW. Never invent a new UUID to “fix” a timeout.</text><line x1="58" y1="1053" x2="1542" y2="1053" stroke="#cdd8d5" stroke-width="2"/><text x="58" y="1083" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#647d80" text-anchor="start">Proposed V1 · Design contract, not a deployed application · 02 October 2026</text></svg>