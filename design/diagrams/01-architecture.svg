<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-label=""><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#60787c"/></marker></defs><rect x="0" y="0" width="1600" height="1060" rx="0" fill="#f4f7f6" stroke="none"/><text x="58" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#0b6e61" text-anchor="start">COUNTER POS / ARCH-01</text><text x="58" y="91" font-family="Inter, DejaVu Sans, sans-serif" font-size="34" font-weight="650" fill="#17333b" text-anchor="start">A modular POS, with explicit trust boundaries</text><text x="58" y="124" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">PWA client + local outbox + server transaction. ERP remains optional.</text><rect x="58" y="168" width="460" height="789" rx="16" fill="#eaf0ed" stroke="none"/><text x="82" y="206" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="650" fill="#4d7071" text-anchor="start">DEVICE / UNTRUSTED CLIENT</text><rect x="576" y="168" width="449" height="789" rx="16" fill="#eaf0ed" stroke="none"/><text x="600" y="206" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="650" fill="#4d7071" text-anchor="start">APPLICATION SERVER</text><rect x="1080" y="168" width="462" height="789" rx="16" fill="#eaf0ed" stroke="none"/><text x="1104" y="206" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="650" fill="#4d7071" text-anchor="start">DURABLE SERVICES</text><rect x="82" y="237" width="412" height="126" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="104" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">POS user interface</text><text x="104" y="305" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Products, cart and receipt</text><text x="104" y="331" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Status is local or acknowledged</text><rect x="82" y="423" width="412" height="188" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="104" y="458" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">IndexedDB + client sync</text><text x="104" y="491" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Frozen sale + lines + payment</text><text x="104" y="517" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Local stock delta + outbox</text><text x="104" y="543" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">One commit before success</text><text x="104" y="569" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Foreground outbox runner</text><rect x="82" y="691" width="412" height="153" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="104" y="726" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">Service worker</text><text x="104" y="759" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Versioned app-shell cache</text><text x="104" y="785" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Explicit safe-time update</text><text x="104" y="811" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">No blind replay of all POSTs</text><rect x="600" y="237" width="401" height="126" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="622" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">API / auth boundary</text><text x="622" y="305" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Secure session / CSRF / scope</text><text x="622" y="331" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Validate incoming commands</text><rect x="600" y="423" width="401" height="188" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="622" y="458" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">Posting service</text><text x="622" y="491" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Stable UUID + payload hash</text><text x="622" y="517" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Price / money / role invariants</text><text x="622" y="543" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Idempotent database posting</text><rect x="600" y="691" width="401" height="153" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="622" y="726" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">Future ERP adapter</text><text x="622" y="759" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Post-commit event delivery</text><text x="622" y="785" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Retry + mapping + reconciliation</text><text x="622" y="811" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Not a checkout dependency</text><rect x="1104" y="423" width="414" height="188" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="1126" y="458" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">PostgreSQL</text><text x="1126" y="491" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Sales + payments + stock ledger</text><text x="1126" y="517" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Balance projection + audit</text><text x="1126" y="543" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Atomic commit / unique identity</text><rect x="1104" y="691" width="414" height="153" rx="12" fill="#fff" stroke="#d2dfd9"/><text x="1126" y="726" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="650" fill="#16393b" text-anchor="start">Encrypted backups / media</text><text x="1126" y="759" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Isolated restore verification</text><text x="1126" y="785" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Separate from unsynced sales</text><text x="1126" y="811" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">No browser-only backup claim</text><line x1="494" y1="299" x2="600" y2="299" stroke="#cdd8d5" stroke-width="2" marker-end="url(#arrow)"/><text x="523" y="284" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#17333b" text-anchor="start">HTTPS</text><line x1="800" y1="363" x2="800" y2="423" stroke="#cdd8d5" stroke-width="2" marker-end="url(#arrow)"/><line x1="288" y1="363" x2="288" y2="423" stroke="#cdd8d5" stroke-width="2" marker-end="url(#arrow)"/><line x1="1001" y1="516" x2="1104" y2="516" stroke="#cdd8d5" stroke-width="2" marker-end="url(#arrow)"/><text x="1016" y="501" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#17333b" text-anchor="start">commit</text><line x1="800" y1="611" x2="800" y2="691" stroke="#cdd8d5" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/><line x1="1310" y1="611" x2="1310" y2="691" stroke="#cdd8d5" stroke-width="2" marker-end="url(#arrow)"/><path d="M 82 768 L 68 768 L 68 300 L 82 300" fill="none" stroke="#60787c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 494 530 L 546 530 L 546 330 L 600 330" fill="none" stroke="#60787c" stroke-width="2" marker-end="url(#arrow)"/><line x1="58" y1="1003" x2="1542" y2="1003" stroke="#cdd8d5" stroke-width="2"/><text x="58" y="1033" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#647d80" text-anchor="start">Design decision · Same-origin client/API · Browser APIs and lifecycle sources: S02–S06</text></svg>