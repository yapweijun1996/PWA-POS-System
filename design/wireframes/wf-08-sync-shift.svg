<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label=""><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#60787c"/></marker></defs><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f4f7f6" stroke="none"/><text x="58" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#0b6e61" text-anchor="start">COUNTER POS / WF-08</text><text x="58" y="91" font-family="Inter, DejaVu Sans, sans-serif" font-size="34" font-weight="650" fill="#17333b" text-anchor="start">Sync recovery and shift-close guard</text><text x="58" y="124" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Expose local state, retry safely and protect unresolved documents.</text><rect x="58" y="157" width="1484" height="671" rx="14" fill="#fff" stroke="#b8c9c3"/><line x1="58" y1="224" x2="1542" y2="224" stroke="#cdd8d5" stroke-width="2"/><rect x="59" y="225" width="165" height="602" rx="0" fill="#f3f5f4" stroke="none"/><text x="81" y="199" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#17333b" text-anchor="start">COUNTER POS</text><text x="254" y="199" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#17333b" text-anchor="start">Everyday Store / Terminal 01</text><text x="1317" y="199" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#61797e" text-anchor="start">Online / Cashier</text><text x="82" y="270" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#5c7278" text-anchor="start">Sell</text><text x="82" y="319" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#5c7278" text-anchor="start">Products</text><text x="82" y="368" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#5c7278" text-anchor="start">Inventory</text><text x="82" y="417" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#5c7278" text-anchor="start">Sales</text><text x="82" y="466" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#5c7278" text-anchor="start">Overview</text><rect x="248" y="248" width="1250" height="73" rx="12" fill="#e8ede8" stroke="#bacabf"/><text x="267" y="279" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="600" fill="#17333b" text-anchor="start">Offline: 3 transactions saved on this device</text><text x="267" y="304" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#17333b" text-anchor="start">Reopen the app when connected to complete foreground synchronization.</text><rect x="248" y="351" width="812" height="70" rx="12" fill="#f5f7f5" stroke="#d2dbd6"/><text x="266" y="381" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17333b" text-anchor="start">LOCAL-T01-018     S$14.00     CASH</text><text x="266" y="406" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#6c8186" text-anchor="start">State: PENDING / same UUID on every retry</text><rect x="248" y="438" width="812" height="70" rx="12" fill="#f5f7f5" stroke="#d2dbd6"/><text x="266" y="468" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17333b" text-anchor="start">LOCAL-T01-019     S$14.00     CASH</text><text x="266" y="493" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#6c8186" text-anchor="start">State: PENDING / same UUID on every retry</text><rect x="248" y="525" width="812" height="70" rx="12" fill="#f5f7f5" stroke="#d2dbd6"/><text x="266" y="555" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#17333b" text-anchor="start">LOCAL-T01-020     S$14.00     CASH</text><text x="266" y="580" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#6c8186" text-anchor="start">State: PENDING / same UUID on every retry</text><rect x="248" y="658" width="239" height="52" rx="7" fill="#52666b" stroke="#cad5d1"/><text x="367.5" y="689.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="500" fill="#fff" text-anchor="middle">Retry sync</text><rect x="505" y="658" width="283" height="52" rx="7" fill="#f1f4f3" stroke="#cad5d1"/><text x="646.5" y="689.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="500" fill="#455c61" text-anchor="middle">Manager recovery export</text><rect x="1100" y="352" width="398" height="358" rx="12" fill="#fff" stroke="#c1d0c7"/><text x="1122" y="393" font-family="Inter, DejaVu Sans, sans-serif" font-size="25" font-weight="600" fill="#17333b" text-anchor="start">Close shift</text><text x="1122" y="435" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#536a73" text-anchor="start">Expected cash / counted cash</text><text x="1122" y="475" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#536a73" text-anchor="start">Variance / required reason</text><text x="1122" y="515" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#536a73" text-anchor="start">Pending or review sales: 3</text><text x="1122" y="555" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#536a73" text-anchor="start">Reconciliation: not ready</text><rect x="1122" y="635" width="354" height="52" rx="7" fill="#f1f4f3" stroke="#cad5d1"/><text x="1299.0" y="666.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="500" fill="#455c61" text-anchor="middle">Final close blocked</text><text x="248" y="768" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">Never offer “clear browser data” as a recovery action. Never label a pending sale as server-synced.</text><text x="65" y="875" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#536a73" text-anchor="start">AUTH_REQUIRED, RETRY and NEEDS_REVIEW need distinct actions. Background Sync is optional, not assumed.</text><line x1="58" y1="943" x2="1542" y2="943" stroke="#cdd8d5" stroke-width="2"/><text x="58" y="973" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#647d80" text-anchor="start">Proposed V1 · Design contract, not a deployed application · 02 October 2026</text></svg>