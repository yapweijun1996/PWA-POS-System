name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_USER: counter_pos_owner
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: counter_pos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U counter_pos_owner -d counter_pos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://counter_pos_owner:local-ci-only@127.0.0.1:5432/counter_pos_test
      PG_BIN: /usr/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:pages
      - run: npm run format:check
      - run: npm run security:check
      - run: npm test -- --reporter=json --outputFile=docs/qa/unit-results.json
      - run: npm run contracts
      - run: git diff --exit-code -- specs/openapi.yaml
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Configure isolated CI runtime role
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE counter_pos_app PASSWORD 'local-ci-only'"
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:pages
      - run: npm run test:e2e
      - run: npm run test:browser-matrix
      - run: npm run backup:rehearse
      - run: npm audit --audit-level=moderate --json > docs/qa/dependency-audit.json
      - run: npm run production:rehearse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-evidence
          path: |
            docs/qa/
            test-results/

  pages-build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static demonstration
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          RELEASE_REVISION: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages-demo
  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified demonstration
        id: deployment
        uses: actions/deploy-pages@v4
