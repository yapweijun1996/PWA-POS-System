name: counter-pos

services:
  postgres:
    image: postgres:16.13-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: counter_pos_owner
      POSTGRES_DB: counter_pos
      POSTGRES_PASSWORD_FILE: /run/secrets/owner_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [owner_password, migrator_password, runtime_password]
    volumes:
      - production-data:/var/lib/postgresql/data
      - ./production/bootstrap.sql:/docker-entrypoint-initdb.d/010-roles.sql:ro
    networks: [database]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'pg_isready -U counter_pos_owner -d counter_pos && test "$$(psql -U counter_pos_owner -d counter_pos -tAc "SELECT count(*) FROM pg_roles WHERE rolname IN (''counter_pos_migrator'',''counter_pos_app'')")" = 2',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    stop_grace_period: 60s
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the reviewed version or digest}
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: runtime
      args:
        RELEASE_REVISION: ${RELEASE_REVISION:?Set the full Git commit ID}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    environment:
      NODE_ENV: production
      DEMO_MODE: "0"
      APP_ORIGIN: https://${APP_HOST:?Set the public DNS hostname}
      DATABASE_URL_FILE: /run/secrets/runtime_database_url
      PERMIT_SECRET_FILE: /run/secrets/permit_secret
    secrets: [runtime_database_url, permit_secret]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [database, frontend]
    stop_grace_period: 40s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging: *logging

  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      APP_HOST: ${APP_HOST:?Set the public DNS hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact address}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    networks: [frontend]
    depends_on:
      app: { condition: service_healthy }
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging: *logging

  operations:
    image: ${OPS_IMAGE:?Set OPS_IMAGE to the reviewed operator image}
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: operations
      args:
        RELEASE_REVISION: ${RELEASE_REVISION:?Set the full Git commit ID}
    profiles: [operations]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m"]
    environment:
      DATABASE_URL_FILE: /run/secrets/migrator_database_url
      BACKUP_RECIPIENT_FILE: /run/secrets/backup_recipient
      BACKUP_DIRECTORY: /backups
    secrets: [migrator_database_url, backup_recipient]
    volumes:
      - ${BACKUP_DIRECTORY:?Set a private retained backup directory}:/backups
    networks: [database]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    logging: *logging

  release-check:
    image: ${OPS_IMAGE:?Set OPS_IMAGE to the reviewed operator image}
    profiles: [operations]
    command: [release-check]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      DEMO_MODE: "0"
      APP_ORIGIN: https://${APP_HOST:?Set the public DNS hostname}
      DATABASE_URL_FILE: /run/secrets/runtime_database_url
      PERMIT_SECRET_FILE: /run/secrets/permit_secret
      RELEASE_PROBE_URL: ${RELEASE_PROBE_URL:-}
    secrets: [runtime_database_url, permit_secret]
    networks: [database, frontend]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 512m
    pids_limit: 128
    logging: *logging

networks:
  database: { internal: true }
  frontend: {}
volumes:
  production-data: {}
  caddy-data: {}
  caddy-config: {}
secrets:
  owner_password:
    file: ${SECRETS_DIRECTORY:?Set a private secrets directory}/owner-password
  migrator_password:
    file: ${SECRETS_DIRECTORY}/migrator-password
  runtime_password:
    file: ${SECRETS_DIRECTORY}/runtime-password
  runtime_database_url:
    file: ${SECRETS_DIRECTORY}/runtime-database-url
  migrator_database_url:
    file: ${SECRETS_DIRECTORY}/migrator-database-url
  permit_secret:
    file: ${SECRETS_DIRECTORY}/permit-secret
  backup_recipient:
    file: ${SECRETS_DIRECTORY}/backup-recipient.pem
